<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="plugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#plugGrad)"/>

  <!-- Lingkaran dekorasi (mirip template login) -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6"/>
  <circle cx="64" cy="64" r="38" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <!-- Pintu / Gate -->
  <rect x="40" y="34" width="34" height="60" rx="4" fill="#ffffff" opacity="0.95"/>

  <!-- Gagang pintu -->
  <circle cx="66" cy="64" r="3" fill="#2563eb"/>

  <!-- Panah keluar (logout) -->
  <path d="M72 64 L96 64 M88 56 L96 64 L88 72"
        stroke="url(#arrowGrad)" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Aksen titik -->
  <circle cx="24" cy="30" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="104" cy="98" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="30" cy="100" r="2" fill="#ffffff" opacity="0.35"/>
</svg>